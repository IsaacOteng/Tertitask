services:
  - type: web
    name: tertitask-api
    env: python
    # collectstatic must run before Daphne starts so Django admin has CSS.
    # Daphne (ASGI) is required — gunicorn (WSGI) does not support WebSockets
    # needed by Django Channels / notifications.
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT tertitask.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tertitask-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: tertitask-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://tertitask.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://tertitask.vercel.app
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        value: tertitask-public
      - key: R2_DELIVERIES_BUCKET
        value: tertitask-deliveries
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_DELIVERIES_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "10"
      - key: CLEARING_DAYS
        value: "7"
      - key: AUTO_APPROVE_DAYS
        value: "3"
      - key: MIN_WITHDRAWAL_AMOUNT
        value: "5000"
      - key: FRONTEND_URL
        value: https://tertitask.vercel.app
      - key: DEBUG
        value: "False"

  - type: cron
    name: auto-approve-orders
    env: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py auto_approve_orders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tertitask-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: tertitask-api
          envVarKey: SECRET_KEY

  - type: cron
    name: release-cleared-orders
    env: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py release_cleared_orders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tertitask-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: tertitask-api
          envVarKey: SECRET_KEY

databases:
  - name: tertitask-db
    databaseName: tertitask
    user: tertitask
